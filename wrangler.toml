name = "cubagest-backend"
main = "src/index.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cubagest-db"
database_id = "067cfeb9-8fd8-4dd1-a201-5f874db9977a"

[vars]
ENVIRONMENT = "production"
# La llave PÚBLICA de los avisos. Va aquí a propósito y no solo en el panel de
# Cloudflare: `wrangler deploy` SOBRESCRIBE las variables del panel con las de
# este archivo, así que lo que se ponga solo en el panel desaparece en el
# siguiente deploy (por eso el deploy avisa del cambio).
# No es un secreto: es pública y va dentro del bundle de la web, que la usa para
# suscribir el navegador. La privada NO va aquí: esa va en el panel, en Secrets.
VAPID_PUBLIC_KEY = "BC1ahvyWmN9-fctxhdWf1FLgLSHaEU3B-vfi-2qscXD1PYgZQBEc402MMbkmMTk_ZFna1uSVRJk3_Lk5x6OLZI0"

[triggers]
# Corre todos los días a las 06:00 UTC (02:00 en Cuba) y cobra las
# suscripciones QvaPay con nextPaymentDate vencido.
crons = ["0 6 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1


# Secrets (no poner valores aqui, usar wrangler secret put):
# JWT_SECRET
# QVAPAY_APP_ID
# QVAPAY_APP_SECRET
# QVAPAY_CALLBACK_URL
# APP_URL
# RESEND_API_KEY
# RESEND_FROM_EMAIL
# ELTOQUE_API_TOKEN  ← token de la API oficial de tasas de elToque.
#   Solicitarlo en https://tasas.eltoque.com/docs/ (formulario por aplicación).
#   Sin token la API responde 401/403 y el backend cae al raspado público.
